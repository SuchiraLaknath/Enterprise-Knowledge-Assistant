# Security patterns, kept apart from code so that they can change without a code change.
# Patterns are regular expressions, matched against text that has been lowercased, had invisible
# characters removed and had Unicode look-alikes folded, so they need only one plain spelling.

input:
  # Attempts to replace the assistant's instructions with the sender's own.
  instruction_override:
    - 'ignore\b.{0,40}\b(instructions?|rules?|prompts?|guidelines?)'
    - 'disregard\b.{0,40}\b(instructions?|rules?|prompts?|guidelines?)'
    - 'forget\b.{0,40}\b(instructions?|rules?|prompts?)'
    - 'override\b.{0,40}\b(instructions?|rules?|safety|guardrails?)'
    - 'you are now\b.{0,40}\b(mode|unrestricted|jailbroken|dan)\b'
    - '\b(developer|maintenance|debug|god|jailbreak) mode\b'
    - '\bact as\b.{0,30}\b(unrestricted|without (any )?(rules|restrictions|filters))'
    - 'new instructions?\s*:'
  # Attempts to get internal instructions or secrets out of the system.
  data_exfiltration:
    - '(reveal|show|print|repeat|output|tell me|give me|leak)\b.{0,40}\b(system|developer|hidden|initial) (prompt|message|instructions?)'
    - '(reveal|show|print|output|give me|leak)\b.{0,40}\b(api[ _-]?keys?|secrets?|passwords?|credentials?|tokens?)\b'
    - '!\[[^\]]*\]\(\s*(https?:)?//'
    - '(send|post|upload|forward|exfiltrate)\b.{0,60}\b(to|at)\b.{0,20}(https?://|www\.)'
  # Attempts to get around the tools' limits.
  tool_abuse:
    - '(call|run|execute|invoke)\b.{0,30}\b(admin|update_incident_status|view_audit_log)\b.{0,30}\b(as|with|using)\b.{0,20}\b(admin|root|role)\b'
    - '\b(set|change|pretend|assume|grant)\b.{0,30}\bmy (role|access|access level|permissions?)\b'
    - '\b(i am|i''m|acting as) (the |an? )?(admin|administrator|root)\b'
    - 'access_level\s*[:=]'
    - '__(import|class|subclasses|builtins|globals)__'

content:
  # Text in a document that speaks to the assistant rather than to a reader. The same override
  # and exfiltration patterns apply, because indirect injection uses the same words.
  injection:
    - 'ignore\b.{0,40}\b(instructions?|rules?|prompts?|guidelines?)'
    - 'disregard\b.{0,40}\b(instructions?|rules?|prompts?|guidelines?)'
    - 'you are now\b'
    - '\b(developer|maintenance|debug|god|jailbreak) mode\b'
    - '(reveal|show|print|repeat|output)\b.{0,40}\b(system|developer|hidden|initial) (prompt|message|instructions?)'
    - '!\[[^\]]*\]\('
    - 'include this (image|link)\b'
    - '\b(assistant|ai|chatbot|model)\s*[:,]\s*(you must|please|always|never|do not)\b'
    - '^\s*(system|assistant)\s*:'

brand:
  # Advice the assistant must not give on the bank's behalf.
  financial_advice:
    - '\byou should (buy|sell|invest|hold)\b'
    - '\bi (recommend|advise|suggest)\b.{0,40}\b(invest|buy|sell|stocks?|shares?|bonds?|loan|mortgage)\b'
    - '\b(guaranteed|sure|risk[- ]free) (returns?|profit|gains?)\b'
    - '\byou (will|are likely to) (be approved|qualify)\b'
  # Comparison with other banks.
  competitor_comparison:
    - '\b(better|worse|cheaper|safer) than\b.{0,30}\b(other banks?|competitors?|rivals?)\b'
    - '\b(unlike|compared (to|with))\b.{0,20}\b(other banks?|our competitors?)\b'
