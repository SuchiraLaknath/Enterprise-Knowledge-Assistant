# Model names. Changing a model here needs no code change.

# Pinecone Inference model that turns text into dense vectors.
embedding_model: llama-text-embed-v2
# Vector size of the embedding model. The Pinecone index must be created with this dimension.
embedding_dimension: 1024
# Pinecone Inference model that reorders retrieved chunks by relevance.
rerank_model: bge-reranker-v2-m3

# LLM routes: each is an ordered chain of provider:model, tried until one succeeds.
# The same provider comes first, because Haiku often clears a Sonnet overload.
llm_routes:
  # Reasoning-heavy work: the supervisor, the research planner and the final answer.
  response:
    - anthropic:claude-sonnet-5-5
    - anthropic:claude-haiku-5-5
  # High-volume, simple work: guards, the judge, map steps and summaries.
  fast:
    - anthropic:claude-haiku-5-5
