# Operational limits. Changing a value here needs no code change.

chunking:
  # Chunks below this size are merged with their neighbour, so that a chunk holds a full idea.
  # A document's last chunk, or one whose neighbour is too large to join, may stay smaller.
  min_tokens: 300
  # Chunks above this size are split, so that the reranker and prompts stay focused.
  max_tokens: 600
  # Share of a chunk repeated at the start of the next, so a sentence cut at a boundary survives.
  overlap_fraction: 0.15
  # Words are multiplied by this to estimate tokens, because exact tokenizers download data.
  tokens_per_word: 1.3

indexing:
  # Pinecone Inference accepts at most 96 inputs in one embedding call.
  embedding_batch_size: 96
  # Records sent in one upsert request.
  upsert_batch_size: 100
  # Serverless location of the index. Available on the Pinecone Starter plan.
  cloud: aws
  region: us-east-1

retrieval:
  # Pinecone namespaces, one per department. A search covers these unless narrowed.
  namespaces: [payments, platform, security, hr-policy, product]
  # Weight of the dense score for a natural-language query; the sparse score gets the remainder.
  default_dense_weight: 0.6
  # Weight of the dense score when a query holds ids or error codes, where exact terms matter more.
  keyword_query_dense_weight: 0.3
  # Candidates fetched from each namespace before merging and reranking.
  candidates_per_namespace: 20
  # Best hybrid results sent to the reranker. Reranking is slow, and the rest rarely win.
  rerank_candidate_count: 30
  # Reranked chunks below this score are dropped. Relevant chunks scored above 0.8 in live
  # checks and unrelated ones near 0.003, and unrelated text only invites weak citations.
  minimum_rerank_score: 0.02
  # Chunks returned to the agent after merging and reranking.
  final_result_count: 8
  # Seconds allowed for one call to embed text or to query a namespace.
  pinecone_timeout_s: 5.0
  # Seconds allowed for one rerank call.
  rerank_timeout_s: 5.0

circuit_breaker:
  # Consecutive failures that open the breaker, which skips the failing service.
  failure_threshold: 5
  # Seconds to wait before trying the failing service again.
  recovery_seconds: 30.0

llm:
  # Seconds allowed for one model to finish, before the gateway tries the next model.
  attempt_timeout_s: 45.0
  # Seconds allowed across all models on a route, so that a full outage stays bounded.
  route_deadline_s: 90.0
  # Retries inside one model. Kept low, because the gateway's next model is the better retry.
  max_retries_per_model: 1
  # Longest reply for a structured output, such as a plan.
  structured_max_tokens: 2000
  # Longest reply for a final answer.
  answer_max_tokens: 4000

conversation:
  # Recent messages sent to the model each turn. Older turns move to the summary in step 10.
  history_message_count: 10

api:
  # Longest message accepted, which limits cost and the room for prompt injection.
  max_message_length: 4000
  # Minutes before a login expires.
  token_lifetime_minutes: 60
  # Seconds allowed to find the trace link, which is sent after the answer.
  trace_lookup_timeout_s: 3.0
  # Steps a graph may take in one turn, which stops any runaway loop.
  graph_recursion_limit: 25

sandbox:
  # Seconds of CPU that generated code may use. Waiting on a helper does not count (rule 7).
  cpu_seconds: 2.0
  # Largest `range` allowed, because code such as `sorted(range(n))` runs only in C.
  max_range_items: 10000

research:
  # How many levels of sub-agents may call each other (rule 7).
  max_depth: 2
  # Sub-agent batches allowed at each level, which limits fan-out (rule 7).
  max_batches_per_level: 8
  # Sub-agent calls allowed in one run, which limits cost (rule 7).
  max_sub_agent_calls: 24
  # Most chunks one sub-agent reads. A larger batch is split between two sub-agents below it.
  sub_agent_chunk_limit: 6
  # Sub-agents running at once, which keeps a run inside provider rate limits.
  max_parallel_sub_agents: 4
  # Searches one plan may run. Each one embeds a query, so this limits Pinecone use.
  max_search_calls: 6
  # Chunks one research search returns. More than an answer needs, as it surveys a topic.
  search_result_count: 40
  # Seconds one run may take in total, including waiting on helpers.
  deadline_s: 120.0
  # Extra attempts for a planner whose code failed, before the fixed template plan.
  plan_regeneration_limit: 1

tools:
  # Seconds allowed for a knowledge search, including any fallback to local search.
  search_timeout_s: 15.0
  # Seconds allowed for one python_analysis run, including the sandbox's CPU budget.
  analysis_timeout_s: 10.0
  # Seconds allowed for one call to the MCP server.
  mcp_timeout_s: 8.0
  # Seconds allowed to read the audit log.
  audit_timeout_s: 5.0
  # Times the tool agent may look at results and call again, which bounds its loop.
  max_rounds: 3
  # Tool calls allowed in one turn, however many rounds they take.
  max_calls_per_turn: 6
  # Longest tool result kept, so that one result cannot flood the answer's prompt.
  max_result_characters: 4000
